<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Drivion - Live AI Safety Monitor</title>
    <style>
        :root {
            --bg-white: #ffffff;
            --bg-green: #f0fdf4;
            --text-main: #0f172a;
            --text-muted: #475569;
            --primary-green: #10b981;
            --primary-green-hover: #059669;
            --border-color: #e2e8f0;
        }
        body { margin: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: var(--bg-white); color: var(--text-main); }
        .monitor-container { padding: 120px 20px 60px 20px; max-width: 900px; margin: 0 auto; text-align: center; }
        .section-title { font-size: 2.2rem; font-weight: 700; margin-bottom: 10px; color: var(--text-main); }
        .section-subtitle { color: var(--text-muted); font-size: 1.05rem; margin-bottom: 30px; }
    </style>
</head>
