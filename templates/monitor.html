<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Drivion - Live AI Safety Monitor</title>
    <style>
        :root {
            --bg-white: #ffffff;
            --bg-green: #f0fdf4;
            --text-main: #0f172a;
            --text-muted: #475569;
            --primary-green: #10b981;
            --primary-green-hover: #059669;
            --border-color: #e2e8f0;
        }
        body { margin: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: var(--bg-white); color: var(--text-main); }
        .monitor-container { padding: 120px 20px 60px 20px; max-width: 900px; margin: 0 auto; text-align: center; }
        .section-title { font-size: 2.2rem; font-weight: 700; margin-bottom: 10px; color: var(--text-main); }
        .section-subtitle { color: var(--text-muted); font-size: 1.05rem; margin-bottom: 30px; }
    </style>
</head>

<body>
    <nav style="display: flex; justify-content: space-between; align-items: center; padding: 14px 8%; background: rgba(15, 23, 42, 0.95); backdrop-filter: blur(12px); border-bottom: 1px solid rgba(255, 255, 255, 0.1); position: fixed; width: 100%; top: 0; z-index: 1000; box-sizing: border-box;">
        <a href="/" style="display: flex; align-items: center; gap: 12px; text-decoration: none;">
            <img src="{{ url_for('static', filename='logo.png') }}" alt="Drivion Logo" style="height: 38px; width: auto; object-fit: contain; border-radius: 8px;" onerror="this.style.display='none'">
            <span style="font-size: 1.4rem; font-weight: 700; color: #ffffff; letter-spacing: 0.5px;">DRIVION</span>
        </a>
        <div class="nav-links">
            <a href="/" style="background: var(--primary-green); color: white !important; padding: 8px 18px; border-radius: 6px; font-weight: 600; text-decoration: none; font-size: 0.9rem;">← Back to Home</a>
        </div>
    </nav>
